[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nameit-pdf"
dynamic = ["version"]
description = "Rename research-article PDFs in a standardised way: author, year, title, publication, publisher."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Jose Teixeira" }]
keywords = ["pdf", "rename", "crossref", "doi", "bibliography", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Text Processing",
]
dependencies = [
    "bibtexparser>=1.4,<2.0",
    "nameparser>=1.1,<2.0",
    "loguru",
    "rich",
    "unidecode",
    "habanero>=2,<3",
    "requests>=2.32,<3",
    "python-magic",
    "pymupdf",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
ai = ["transformers", "torch", "pillow"]
dev = ["coverage", "mypy", "types-requests"]

[project.urls]
Homepage = "https://github.com/jaateixeira/nameit"

[project.scripts]
nameit = "nameit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nameit.__version__" }

[tool.setuptools.packages.find]
include = ["nameit*"]

[tool.mypy]
ignore_missing_imports = true   # habanero, magic, pymupdf, bibtexparser ship no type stubs
warn_unused_ignores = true
files = ["nameit"]
