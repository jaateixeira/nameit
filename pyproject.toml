[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nameit-pdf"
dynamic = ["version"]
description = "Rename research-article PDFs in a standardised way: author, year, title, publication, publisher."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jose Teixeira" }]
keywords = ["pdf", "rename", "crossref", "doi", "bibliography", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "bibtexparser>=1.4,<2.0",
    "nameparser>=1.1,<2.0",
    "loguru",
    "rich",
    "unidecode",
    "habanero>=2,<3",
    "requests>=2.32,<3",
    "python-magic",
    "pymupdf",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["coverage", "mypy", "types-requests"]

[project.urls]
Homepage = "https://github.com/jaateixeira/nameit"
Issues = "https://github.com/jaateixeira/nameit/issues"

[project.scripts]
nameit = "nameit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "nameit.__version__" }

[tool.setuptools.packages.find]
include = ["nameit*"]

[tool.coverage.run]
source = ["nameit"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
ignore_missing_imports = true   # habanero, magic, pymupdf, bibtexparser ship no type stubs
warn_unused_ignores = true
files = ["nameit"]
