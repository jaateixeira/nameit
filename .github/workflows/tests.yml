name: Regular Unit Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Type check
        run: |
          pip install mypy types-requests
          mypy
      - name: Run tests
        run: |
          pip install coverage
          coverage run -m unittest discover -s unit-tests/ -v
          coverage report --skip-covered --fail-under=85

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel and run the command
        run: |
          sudo apt-get update && sudo apt-get install -y libmagic1
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/nameit --help
